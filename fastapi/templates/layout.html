
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Soil Monitor{% endblock title %}</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/main.css') }}"
    >
    <link rel="manifest" href="{{ url_for('static', path='/manifest.json') }}">
    <link rel="icon" type="image/png"
      href="/static/icons/plant.png?v=2">

    <link rel="apple-touch-icon"
      href="{{ url_for('static', path='/icons/plant.png') }}">

    {% block extra_css %}{% endblock extra_css %}
</head>


<body class="d-flex flex-column min-vh-100">

    <!-- Floating navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark main-navbar">
        <div class="container-fluid px-4 px-lg-5">

            <a class="navbar-brand fw-bold fs-3" href="/">
                🌱 Soil Monitor
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/sensor-readings/">History</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/docs">API Docs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="main-content flex-grow-1">
        {% block content %}
        {% endblock content %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-light py-3">
        <div class="container text-center">

            <p class="mb-1 fw-semibold">
                🌱 Soil Monitor
            </p>

            <small class="text-secondary">
                Raspberry Pi Soil Moisture Monitoring Project
            </small>
            <p class="text-secondary small mb-0 mt-2">
                &copy; 2026 Kornel Ori
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}
    
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<<script>
document.addEventListener('DOMContentLoaded', function () {
    const ctx = document.getElementById('moistureChart');

    // Stop if this page does not contain the chart
    if (!ctx) return;

    // Prevent creating another chart on the same canvas
    const existingChart = Chart.getChart(ctx);
    if (existingChart) {
        existingChart.destroy();
    }

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00'],
            datasets: [{
                label: 'Soil moisture (%)',
                data: [62, 60, 58, 65, 68, 66],
                borderColor: '#3288dc',
                backgroundColor: 'rgba(50, 136, 220, 0.12)',
                pointBackgroundColor: '#3288dc',
                fill: true,
                tension: 0.4,
                pointRadius: 3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    min: 0,
                    max: 100,
                    ticks: {
                        callback: value => value + '%'
                    },
                    grid: {
                        color: 'rgba(0,0,0,0.06)'
                    }
                },
                x: {
                    grid: {
                        display: false
                    }
                }
            }
        }
    });
});
</script>
    {% endblock extra_js %}

</body>

</html>
